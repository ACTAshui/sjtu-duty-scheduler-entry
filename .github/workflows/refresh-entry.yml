name: Refresh EdgeOne entry

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test route selection
        run: node --test tests/route-choice.test.mjs
      - name: Refresh Tencent EdgeOne preview
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: npx --yes edgeone@1.6.28 makers deploy ./edgeone-app --name sjtu-duty-scheduler --env production --area global --token "$EDGEONE_API_TOKEN" --json | tee deploy.log
      - name: Extract current preview URL
        run: node scripts/write-target.mjs
      - name: Prepare public entry files
        run: |
          mkdir pages-public
          cp index.html route-choice.mjs target.json pages-public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-public
      - name: Publish fixed entry page
        id: deployment
        uses: actions/deploy-pages@v4
