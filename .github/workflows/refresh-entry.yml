name: Publish verified scheduler entry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test route selection
        run: node --test tests/route-choice.test.mjs
      - name: Prepare public entry files
        run: |
          mkdir pages-public
          cp index.html route-choice.mjs target.json pages-public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-public
      - name: Publish stable CloudBase entry page
        id: deployment
        uses: actions/deploy-pages@v4
