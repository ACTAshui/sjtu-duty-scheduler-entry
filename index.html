<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>交小助 · 排班系统入口</title>
  <style>
    :root{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#172033;background:#f6f2ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);padding:34px;border:1px solid #eadfd9;border-radius:24px;background:#fff;box-shadow:0 20px 60px #5b23331a;text-align:center}.mark{width:58px;height:58px;margin:auto;display:grid;place-items:center;border-radius:18px;background:#9f243d;color:#fff;font-size:28px;font-weight:800}h1{margin:18px 0 8px;font-size:25px}p{color:#667085;line-height:1.7}.status{margin:22px 0;padding:14px;border-radius:14px;background:#f9f4f2;color:#7a263a}.actions{display:grid;gap:10px}a{display:block;padding:13px 18px;border-radius:12px;text-decoration:none;font-weight:700}.primary{background:#9f243d;color:#fff}.secondary{border:1px solid #d8c8c3;color:#7a263a}small{display:block;margin-top:18px;color:#98a2b3}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">交</div>
    <h1>交小助排班系统</h1>
    <p>正在进入已经完整验证的排班系统。中国大陆部分网络需要先开启 VPN。</p>
    <div class="status" id="status">正式系统使用 Cloudflare 数据库与注册接口</div>
    <div class="actions">
      <a class="primary" id="enter" href="https://sjtu-duty-scheduler.sjtu-duty-scheduler.workers.dev/">立即进入</a>
      <a class="secondary" href="https://sjtu-duty-scheduler.sjtu-duty-scheduler.workers.dev/">打开正式系统</a>
    </div>
    <small>请勿使用旧腾讯临时链接注册；其静态页面无法提交注册接口。</small>
  </main>
  <script type="module">
    const cloudflare='https://sjtu-duty-scheduler.sjtu-duty-scheduler.workers.dev/';
    setTimeout(()=>location.replace(cloudflare),1800);
  </script>
</body>
</html>
